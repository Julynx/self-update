[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-self-update"
version = "0.9.0"
description = "Single-file, zero-dependency self-update on launch for Python CLIs."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Julynx", email = "julicabria@outlook.com" }
]
keywords = ["self-update", "updater", "cli", "pip", "pipx", "uv"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Julynx/self-update"
Repository = "https://github.com/Julynx/self-update"
Issues = "https://github.com/Julynx/self-update/issues"

[tool.setuptools]
py-modules = ["selfupdate"]
